<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    color: #f2f6ff; background: #0a0e14;
    display: flex; align-items: center; justify-content: center; height: 100%;
    -webkit-font-smoothing: antialiased;
  }
  /* An HDRI is an environment: show the full equirectangular panorama, edge to edge. */
  .pano {
    position: relative; width: 380px; aspect-ratio: 2 / 1; border-radius: 20px; overflow: hidden;
    background: #10151d center / cover no-repeat;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
  }
  .overlay {
    position: absolute; inset: auto 0 0 0; padding: 28px 16px 12px;
    background: linear-gradient(transparent, rgba(6,9,14,0.85));
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  }
  .name { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; text-shadow: 0 1px 8px rgba(0,0,0,0.6); }
  .pills { display: flex; gap: 5px; flex: none; }
  .pill {
    padding: 2px 9px; border-radius: 999px; font-size: 10px; font-weight: 600;
    color: #fde68a; background: rgba(250,204,21,0.16); border: 1px solid rgba(250,204,21,0.30);
  }
  .cc0 { color: #86efac; background: rgba(34,197,94,0.14); border-color: rgba(34,197,94,0.30); }
</style>
</head>
<body>
  <div class="pano" id="pano">
    <div class="overlay">
      <div class="name" id="name">—</div>
      <div class="pills">
        <span class="pill" id="res"></span>
        <span class="pill cc0">CC0</span>
      </div>
    </div>
  </div>
<script>
  var A = (window.__ASSET__ || {});
  var slug = A.slug || "";
  document.getElementById("pano").style.backgroundImage =
    "url('https://cdn.polyhaven.com/asset_img/primary/" + slug + ".png?height=380')";
  document.getElementById("name").textContent = A.name || slug || "HDRI";
  document.getElementById("res").textContent = A.max_resolution || "";
  console.log("polyhaven hdri view rendered for " + slug);
</script>
</body>
</html>
