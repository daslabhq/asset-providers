<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    color: #f2f6ff; background: #0a0e14;
    display: flex; align-items: center; justify-content: center; height: 100%;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 300px; border-radius: 20px; overflow: hidden; text-align: center;
    background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
  }
  /* A model gets its studio render on a pedestal gradient, like a product shot. */
  .stage {
    height: 210px; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(80% 90% at 50% 100%, rgba(59,130,246,0.18), transparent 70%), #10151d;
  }
  .stage img { max-width: 82%; max-height: 88%; object-fit: contain; filter: drop-shadow(0 14px 24px rgba(0,0,0,0.5)); }
  .body { padding: 12px 16px 16px; }
  .name { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .meta { margin-top: 4px; font-size: 12px; color: rgba(242,246,255,0.55); }
  .row { margin-top: 10px; display: flex; gap: 5px; justify-content: center; }
  .pill {
    padding: 2px 9px; border-radius: 999px; font-size: 10px; font-weight: 600;
    color: #93c5fd; background: rgba(59,130,246,0.16); border: 1px solid rgba(59,130,246,0.30);
  }
  .cc0 { color: #86efac; background: rgba(34,197,94,0.14); border-color: rgba(34,197,94,0.30); }
</style>
</head>
<body>
  <div class="card">
    <div class="stage"><img id="render" alt="" /></div>
    <div class="body">
      <div class="name" id="name">—</div>
      <div class="meta" id="authors"></div>
      <div class="row">
        <span class="pill">glTF · USD · FBX</span>
        <span class="pill cc0">CC0</span>
      </div>
    </div>
  </div>
<script>
  var A = (window.__ASSET__ || {});
  var slug = A.slug || "";
  document.getElementById("render").src =
    "https://cdn.polyhaven.com/asset_img/primary/" + slug + ".png?height=420";
  document.getElementById("render").alt = (A.name || slug) + " — CC0 3D model";
  document.getElementById("name").textContent = A.name || slug || "Model";
  document.getElementById("authors").textContent = A.authors ? "by " + A.authors : "";
  console.log("polyhaven model view rendered for " + slug);
</script>
</body>
</html>
