<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    color: #f2f6ff;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(59,130,246,0.30), transparent 60%),
      #0a0e14;
    display: flex; align-items: center; justify-content: center;
    height: 100%; -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 340px; border-radius: 24px; overflow: hidden;
    background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
  }
  .thumb { display: block; width: 100%; aspect-ratio: 2 / 1; object-fit: cover; background: #10151d; }
  .body { padding: 16px 18px 18px; }
  .name { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
  .meta { margin-top: 5px; font-size: 12px; color: rgba(242,246,255,0.55); }
  .row { margin-top: 12px; display: flex; gap: 6px; align-items: center; }
  .pill {
    padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
    color: #93c5fd; background: rgba(59,130,246,0.16); border: 1px solid rgba(59,130,246,0.30);
  }
  .cc0 { color: #86efac; background: rgba(34,197,94,0.14); border-color: rgba(34,197,94,0.30); }
</style>
</head>
<body>
  <div class="card">
    <img class="thumb" id="thumb" alt="" />
    <div class="body">
      <div class="name" id="name">—</div>
      <div class="meta" id="tags"></div>
      <div class="row">
        <span class="pill" id="kind"></span>
        <span class="pill" id="res"></span>
        <span class="pill cc0">CC0</span>
      </div>
    </div>
  </div>
<script>
  var A = (window.__ASSET__ || {});
  var slug = A.slug || "";
  // The preview image, not the payload: download URLs are resolved on demand
  // via polyhaven_files, since they depend on the resolution and format the
  // consumer wants.
  document.getElementById("thumb").src = "https://cdn.polyhaven.com/asset_img/primary/" + slug + ".png?height=480";
  document.getElementById("thumb").alt = (A.name || slug) + " — Poly Haven " + (A.asset_kind || "") + " (CC0)";
  document.getElementById("name").textContent = A.name || slug || "Poly Haven asset";
  document.getElementById("tags").textContent = A.tags || "";
  document.getElementById("kind").textContent = A.asset_kind || "asset";
  document.getElementById("res").textContent = A.max_resolution || "";
  console.log("polyhaven preview rendered for " + slug);
</script>
</body>
</html>
