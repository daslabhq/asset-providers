<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    color: #f2f6ff; background: #0a0e14;
    display: flex; align-items: center; justify-content: center; height: 100%;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 340px; border-radius: 20px; overflow: hidden;
    background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
  }
  /* Poly Haven textures tile seamlessly — so tile one, and the repeat IS the preview. */
  .tiles { width: 100%; height: 170px; background: #10151d repeat; background-size: 110px; }
  .body { padding: 14px 18px 16px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .name { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .meta { margin-top: 4px; font-size: 12px; color: rgba(242,246,255,0.55); }
  .pills { display: flex; gap: 5px; flex: none; }
  .pill {
    padding: 2px 9px; border-radius: 999px; font-size: 10px; font-weight: 600;
    color: #93c5fd; background: rgba(59,130,246,0.16); border: 1px solid rgba(59,130,246,0.30);
  }
  .cc0 { color: #86efac; background: rgba(34,197,94,0.14); border-color: rgba(34,197,94,0.30); }
</style>
</head>
<body>
  <div class="card">
    <div class="tiles" id="tiles"></div>
    <div class="body">
      <div>
        <div class="name" id="name">—</div>
        <div class="meta" id="tags"></div>
      </div>
      <div class="pills">
        <span class="pill" id="res"></span>
        <span class="pill cc0">CC0</span>
      </div>
    </div>
  </div>
<script>
  var A = (window.__ASSET__ || {});
  var slug = A.slug || "";
  document.getElementById("tiles").style.backgroundImage =
    "url('https://cdn.polyhaven.com/asset_img/thumbs/" + slug + ".png?height=220')";
  document.getElementById("name").textContent = A.name || slug || "Texture";
  document.getElementById("tags").textContent = A.tags || "";
  document.getElementById("res").textContent = A.max_resolution || "";
  console.log("polyhaven texture view rendered for " + slug);
</script>
</body>
</html>
